<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixed-height translation control regression</title>
  <style>
    body { margin: 40px; color: #1f2328; background: #fff; font: 16px/1.5 system-ui; }
    main { max-width: 850px; }
    .merge-box { border: 1px solid #1f883d; border-radius: 8px; overflow: hidden; }
    .merge-status { padding: 24px; }
    .merge-footer { display: flex; gap: 16px; align-items: center; padding: 16px; background: #f6f8fa; }
    .button-group { display: inline-flex; flex-shrink: 0; }
    button, [role="button"], [role="menuitem"] { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px; border: 1px solid #176f31; border-radius: 6px; background: #1f883d; color: #fff; font: 600 14px/20px system-ui; cursor: pointer; }
    .button-content { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .button-label { display: grid; place-items: center; }
    #merge-button { border-radius: 6px 0 0 6px; }
    #merge-menu { border-radius: 0 6px 6px 0; }
    .other-controls { display: flex; gap: 20px; align-items: center; padding-top: 28px; }
    .badge { padding-left: 6px; }
  </style>
</head>
<body>
<main>
  <div class="merge-box">
    <div class="merge-status">
      <h2>No conflicts with base branch</h2>
      <p>Merging can be performed automatically.</p>
    </div>
    <div class="merge-footer">
      <div class="button-group">
        <button id="merge-button" type="button"><span class="button-content" data-display="flex"><span class="button-label" data-display="grid">Merge pull request</span></span></button>
        <button id="merge-menu" type="button" aria-label="Choose merge method"><span aria-hidden="true">▾</span></button>
      </div>
      <p>You can also merge this with the command line.</p>
    </div>
  </div>
  <div class="other-controls">
    <a id="save-button" href="#saved" role="button"><span class="button-content" data-display="flex"><span aria-hidden="true">✓</span><span class="button-label" data-display="grid">Save changes</span></span></a>
    <div id="menu-action" tabindex="0" role="menuitem"><div class="button-content" data-display="flex">Open settings</div></div>
    <button id="split-button" type="button">Review <span class="button-label" data-display="grid">changes</span><span class="badge notranslate" translate="no">23</span></button>
  </div>
  <p id="prose">Read the <a href="#guide">merge guide</a> before continuing.</p>
</main>
<script>
  for (const control of document.querySelectorAll('button, [role="button"], [role="menuitem"]')) {
    control.dataset.clickCount = '0';
    control.addEventListener('click', (event) => {
      event.preventDefault();
      control.dataset.clickCount = String(Number(control.dataset.clickCount) + 1);
    });
  }
</script>
</body>
</html>
