<!doctype html>
<!--
  @file entrypoints/popup/index.html
  文件职责：提供浏览器工具栏 popup 的最小 HTML 外壳。
  主要内容：声明中文与 browser_action 元数据，提供预留首屏高度的图形等待状态；用独立无框架脚本提前唤醒后台，与应用模块加载并行。
  模块边界：预唤醒只返回引导状态提示，不读取配置快照或当前标签页，渲染与所有交互由 popup Vue 应用完成。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluentRead-流畅阅读</title>
    <meta name="manifest.type" content="browser_action" />
    <script src="/popup-startup.js"></script>
  </head>
  <body class="popup-page" style="margin: 0;">
    <div id="app">
      <div class="popup-startup" style="min-height: 460px;" role="status" aria-busy="true" aria-label="FluentRead">
        <img src="/icon/128.png" alt="" width="24" height="24" />
        <i aria-hidden="true"></i>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
